name: Deploy BiddWorld preview and build GoDaddy package
on:
  workflow_dispatch:
    inputs:
      confirm_production_deployment:
        description: 'Explicitly approve a Production deployment from the protected main branch.'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: biddworld-production-deployment
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.confirm_production_deployment == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build GitHub Pages preview
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SUPABASE_URL: https://hbqatszyzqobgtauyuzy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_hdgI3LooDiX9yf91OzvyYQ_qSI8AqoY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Build GoDaddy root-domain website
        run: |
          npm run build
          mkdir -p godaddy-package/website godaddy-package/database/migrations
          cp -a dist/. godaddy-package/website/
          cp public/.htaccess godaddy-package/website/.htaccess
          cp -a supabase/migrations/. godaddy-package/database/migrations/
          cp GODADDY-README.md godaddy-package/README.txt
          cd godaddy-package
          zip -qr ../BiddWorld-GoDaddy-Package.zip .
        env:
          VITE_SUPABASE_URL: https://hbqatszyzqobgtauyuzy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_hdgI3LooDiX9yf91OzvyYQ_qSI8AqoY
      - name: Upload GoDaddy package
        uses: actions/upload-artifact@v4
        with:
          name: BiddWorld-GoDaddy-Package
          path: BiddWorld-GoDaddy-Package.zip
          if-no-files-found: error
          retention-days: 30
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_production_deployment == true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
